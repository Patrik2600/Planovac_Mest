<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plánovač měst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mapa districtu (9 bloků × 4 loty) vlevo, souhrn města vpravo; výběr stavby v dialogu po kliknutí na lot. */
:root {
  --bg:#E6E9E0; --panel:#F5F6F0; --panel-2:#ECEFE5; --ink:#1C2720; --ink-2:#4A5A4F; --line:#C5CDBC;
  --accent:#1E6C88; --accent-ink:#FFFFFF; --good:#26764A; --bad:#B03535; --warn:#9A5F0A;
  --grass:#A9B77F; --grass-line:rgba(255,255,255,.8); --road:#CBAC76; --frame:#14181A;
  --water:#5AA5C2; --wall:#8D9096; --moat:#2D6C8C; --paved:#BDB6A6; --paved-2:#8F8A7C; --lamp:#FFD66B;
  --cat-ink:#1B241D;
  --c-res:#DCC9A0; --c-trade:#E2B95F; --c-fun:#E09B88; --c-faith:#BFA9DA; --c-edu:#93B8DC;
  --c-civic:#C6C9CE; --c-mil:#CF8479; --c-water:#74BCC9; --c-util:#A5BFB6;
  --display:'Alegreya SC', Georgia, serif; --body:'Alegreya Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#131814; --panel:#1B221D; --panel-2:#222B25; --ink:#E5E9DD; --ink-2:#A3B1A6; --line:#334037;
    --accent:#5DB5D4; --accent-ink:#06222D; --good:#5CC48A; --bad:#EF7C7C; --warn:#E3A545;
    --grass:#58663A; --grass-line:rgba(255,255,255,.35); --road:#7A6338; --frame:#050706;
    --water:#2C6F8A; --wall:#6F737A; --moat:#1D5877; --paved:#5F5B52; --paved-2:#2E2C27; --lamp:#FFD66B;
    --cat-ink:#F1F0E8;
    --c-res:#6D5C3A; --c-trade:#86681F; --c-fun:#8A4B40; --c-faith:#5F4D80; --c-edu:#2F5E87;
    --c-civic:#4C5159; --c-mil:#7F3B34; --c-water:#1F6672; --c-util:#40605A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#131814; --panel:#1B221D; --panel-2:#222B25; --ink:#E5E9DD; --ink-2:#A3B1A6; --line:#334037;
  --accent:#5DB5D4; --accent-ink:#06222D; --good:#5CC48A; --bad:#EF7C7C; --warn:#E3A545;
  --grass:#58663A; --grass-line:rgba(255,255,255,.35); --road:#7A6338; --frame:#050706;
  --water:#2C6F8A; --wall:#6F737A; --moat:#1D5877; --paved:#5F5B52; --paved-2:#2E2C27; --lamp:#FFD66B;
  --cat-ink:#F1F0E8;
  --c-res:#6D5C3A; --c-trade:#86681F; --c-fun:#8A4B40; --c-faith:#5F4D80; --c-edu:#2F5E87;
  --c-civic:#4C5159; --c-mil:#7F3B34; --c-water:#1F6672; --c-util:#40605A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; }
.top h1 { font-size: 30px; line-height: 1; }
.top .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.kingdom { display: flex; flex-wrap: wrap; gap: 6px; }
.kpill { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
.kpill b { font-family: var(--mono); font-weight: 500; color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }

/* tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-weight: 500; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab.add { border-style: dashed; color: var(--ink-2); background: transparent; }
.tab.add:hover { color: var(--ink); border-color: var(--ink-2); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side { position: sticky; top: 12px; }
@media (max-width: 920px) { .side { position: static; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar .grow { flex: 1 1 180px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.field input, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 16px; color: var(--ink); text-transform: none; letter-spacing: 0; width: 100%; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* the sheet */
.sheet { position: relative; max-width: 680px; width: 100%; background: var(--road); border: 3px solid var(--frame); padding: 24px;
  background-image: radial-gradient(rgba(0,0,0,.07) 1px, transparent 1.2px); background-size: 7px 7px; }
@media (max-width: 480px) { .sheet { padding: 17px; } }
.lots { display: grid; grid-template-columns: 1fr 1fr .34fr 1fr 1fr .34fr 1fr 1fr; grid-template-rows: 1fr 1fr .34fr 1fr 1fr .34fr 1fr 1fr; aspect-ratio: 1 / 1; container-type: inline-size; position: relative; }
.lot { background: var(--grass); border: 0; border-radius: 0; position: relative; padding: 0; color: var(--ink); z-index: 1; }
.lot.cr { border-right: 2px dashed var(--grass-line); }
.lot.rb { border-bottom: 2px dashed var(--grass-line); }
.lot i { position: absolute; left: 3px; top: 1px; font-style: normal; font-family: var(--mono); font-size: 9px; opacity: .5; }
.lot::after { content: "+"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; opacity: 0; color: var(--ink); }
.lot:hover::after, .lot:focus-visible::after { opacity: .6; }
.lot:hover { filter: brightness(1.1); }
.bld { z-index: 2; margin: 2px; border: 1.5px solid rgba(0,0,0,.5); border-radius: 3px; background: var(--c); color: var(--cat-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding: 2px; overflow: hidden; position: relative;
  font-size: clamp(8.5px, 2.15cqw, 13.5px); line-height: 1.08; font-weight: 700; overflow-wrap: anywhere; }
.bld:hover { filter: brightness(1.08); box-shadow: 0 0 0 2px var(--accent); }
.bld .mini { font-family: var(--mono); font-weight: 500; font-size: .82em; opacity: .85; }
.bld .wm { position: absolute; top: 1px; right: 1px; width: 15px; height: 15px; border-radius: 50%; background: var(--warn); color: #fff; font-style: normal; font-size: 11px; display: grid; place-items: center; }
.bld.waterway { background: repeating-linear-gradient(135deg, var(--water) 0 6px, color-mix(in srgb, var(--water) 80%, #fff) 6px 12px); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.5); }
.ov { z-index: 4; justify-self: end; align-self: end; width: 19px; height: 19px; margin: 0 3px 3px 0; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.55); background: var(--ink); color: var(--bg); font-family: var(--mono); font-size: 9px; padding: 0; display: grid; place-items: center; }
.cat-res { --c: var(--c-res); } .cat-trade { --c: var(--c-trade); } .cat-fun { --c: var(--c-fun); } .cat-faith { --c: var(--c-faith); } .cat-edu { --c: var(--c-edu); }
.cat-civic { --c: var(--c-civic); } .cat-mil { --c: var(--c-mil); } .cat-water { --c: var(--c-water); } .cat-util { --c: var(--c-util); }

.edge { position: absolute; z-index: 0; display: flex; pointer-events: none; }
.edge.n, .edge.s { left: 0; right: 0; height: 18px; flex-direction: column; }
.edge.e, .edge.w { top: 0; bottom: 0; width: 18px; flex-direction: row; }
.edge.n { top: 0; } .edge.s { bottom: 0; flex-direction: column-reverse; } .edge.w { left: 0; } .edge.e { right: 0; flex-direction: row-reverse; }
.edge.is-water { background: repeating-linear-gradient(45deg, var(--water) 0 7px, color-mix(in srgb, var(--water) 75%, #fff) 7px 14px); }
.edge b { flex: 1; }
.edge b.wall { background: repeating-linear-gradient(90deg, var(--wall) 0 9px, color-mix(in srgb, var(--wall) 70%, #000) 9px 10px); border: 1px solid rgba(0,0,0,.5); }
.edge b.moat { background: var(--moat); }

.borders { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 16px; }
.brow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.brow .bl { width: 62px; font-weight: 700; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 4px 10px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tg { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 10px; font-size: 14px; }
.tg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tg[disabled] { opacity: .4; cursor: not-allowed; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; background: var(--c); border: 1px solid rgba(0,0,0,.4); display: inline-block; }
.h3 { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: .02em; }

/* chips */
.chip { display: inline-block; font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }

/* summary */
.sum h2 { font-size: 22px; overflow-wrap: anywhere; }
.sum .size { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.cost { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 2px; }
.cost .big { font-family: var(--mono); font-size: 40px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.cost .u { font-family: var(--display); font-size: 18px; }
.costsub { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 0; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; text-align: left; display: flex; flex-direction: column; width: 100%; }
.stat:hover, .cost:hover .big, .mrow:hover { border-color: var(--accent); }
.stat .sl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.stat .sl::after { content: " ▸"; opacity: .5; }
.stat .sv { font-family: var(--mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .sv.pos { color: var(--good); } .stat .sv.neg { color: var(--bad); }
.stat.unrest .sv.pos { color: var(--bad); } .stat.unrest .sv.neg { color: var(--good); }
button.cost { background: none; border: 0; padding: 0; text-align: left; width: 100%; color: inherit; }
button.cost:hover .u { text-decoration: underline; }
button.kvb { background: none; border: 0; border-bottom: 1px dotted var(--line); width: 100%; text-align: left; color: inherit; }
button.kvb:hover span { text-decoration: underline; }
.mrow { background: none; border: 0; border-bottom: 1px dotted var(--line); padding: 2px 0; text-align: left; color: inherit; display: block; width: 100%; }
.mrow:hover span { text-decoration: underline; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 4px 0; border-bottom: 1px dotted var(--line); }
.kv b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; font-size: 13px; margin-top: 8px; }
.mods span { color: var(--ink-2); } .mods b { font-family: var(--mono); font-weight: 500; float: right; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }
.warns { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.warns li { display: flex; gap: 8px; align-items: baseline; }
.warns li::before { content: "!"; flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--warn); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; transform: translateY(2px); }
.warns .lotn { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.ok { color: var(--good); font-size: 14px; margin: 8px 0 0; }

/* modal */
.shade { position: fixed; inset: 0; z-index: 50; background: rgba(8,12,9,.62); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.45); overflow: hidden; }
.dlg-h { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { font-size: 20px; }
.dlg-b { padding: 12px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.x { border: 0; background: transparent; font-size: 26px; line-height: 1; padding: 0 6px; color: var(--ink-2); }
.cats { display: flex; flex-wrap: wrap; gap: 5px; }
.cats button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 2px 10px; font-size: 14px; }
.cats button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 16px; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.list h3 { grid-column: 1 / -1; font-size: 15px; color: var(--ink-2); margin-top: 6px; }
.item { text-align: left; background: var(--bg); border: 1px solid var(--line); border-left: 8px solid var(--c); border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.item:hover:not([disabled]) { border-color: var(--accent); border-left-color: var(--c); box-shadow: 0 0 0 1px var(--accent); }
.item[disabled] { opacity: .45; cursor: not-allowed; }
.item .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.item .t b { font-size: 16px; overflow-wrap: anywhere; }
.item .m { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.item .why { font-size: 12.5px; color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bigchips .chip { font-size: 13px; padding: 2px 8px; }
.ovl { display: flex; flex-direction: column; gap: 6px; }
.ovl .o { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 15px; max-width: calc(100% - 32px); }
.foot { font-size: 13px; color: var(--ink-2); }
.foot a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bld, .lot { transition: filter .12s; } }

/* paved streets, sewer, lamps, watergate */
.sheet.paved { background-color: var(--paved);
  background-image: radial-gradient(ellipse 3.4px 2.5px at 50% 50%, rgba(0,0,0,.24) 0 85%, transparent 100%), radial-gradient(ellipse 3.4px 2.5px at 50% 50%, rgba(0,0,0,.24) 0 85%, transparent 100%), repeating-linear-gradient(0deg, rgba(255,255,255,.12) 0 1px, transparent 1px 8px);
  background-size: 10px 8px, 10px 8px, auto; background-position: 0 0, 5px 4px, 0 0; }
.sheet.paved .lot, .sheet.paved .bld { box-shadow: 0 0 0 2px var(--paved-2); }
.sheet.paved .bld:hover { box-shadow: 0 0 0 2px var(--accent); }
.mh { z-index: 1; align-self: center; justify-self: center; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle, #6b6f74 0 25%, #3b3e42 26% 55%, #6b6f74 56% 70%, #2b2d30 71%); box-shadow: 0 0 0 1px rgba(0,0,0,.5); pointer-events: none; }
.ov.ov-lamps { background: var(--lamp); color: #3A2A00; border-color: #B8860B; box-shadow: 0 0 12px 4px color-mix(in srgb, var(--lamp) 80%, transparent); }
.ov.ov-spring { background: var(--water); color: #fff; }
.edge b.wall { position: relative; }
.edge b.wall i.gate { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--water); border: 1px solid rgba(0,0,0,.6); }
.edge.n b.wall i.gate, .edge.s b.wall i.gate { width: 16%; height: 100%; }
.edge.e b.wall i.gate, .edge.w b.wall i.gate { height: 16%; width: 100%; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* breakdown */
.brk { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dotted var(--line); align-items: baseline; }
.brk .w { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 1px; }
.brk b.v { font-family: var(--mono); font-weight: 500; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.brk b.v.pos { color: var(--good); } .brk b.v.neg { color: var(--bad); }
.brk.tot { border-bottom: 0; border-top: 2px solid var(--ink); font-family: var(--display); font-size: 17px; }

/* magic items */
.mib { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
.mih { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
.slot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 0 5px 8px; border-left: 5px solid var(--tc, var(--line)); margin-bottom: 4px; }
.slot.t-medium { --tc: var(--accent); } .slot.t-major { --tc: var(--warn); } .slot.t-minor { --tc: var(--line); }
.slot .tier { font-family: var(--mono); font-size: 12px; width: 58px; text-transform: uppercase; color: var(--ink-2); }
.slot .kinds { font-size: 12px; color: var(--ink-2); flex-basis: 100%; margin: -2px 0 0 0; }
.mi-in { flex: 1 1 150px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 16px; }
.slot .mres { flex-basis: 100%; font-size: 13px; color: var(--ink-2); }
.slot .mres.hit { color: var(--good); font-weight: 700; }
.lnk { font-size: 20px; text-decoration: none; color: var(--accent); padding: 0 4px; }
.lnk[hidden] { display: none; }

/* save bar */
.savebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; }
.sstat { font-size: 14px; color: var(--ink-2); flex: 1 1 200px; min-width: 0; }
.sstat .dirty { color: var(--warn); }
label.btn { display: inline-block; }

/* magic tiles */
.mitiles { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; width: 100%; background: none; border: 0; padding: 0; margin-top: 8px; text-align: left; color: inherit; }
.mt { flex: 1 1 90px; background: var(--bg); border: 1px solid var(--line); border-left: 6px solid var(--tc, var(--line)); border-radius: 6px; padding: 6px 10px; display: flex; flex-direction: column; }
.mt.t-medium { --tc: var(--accent); } .mt.t-major { --tc: var(--warn); }
.mt b { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1.1; }
.mt i { font-style: normal; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.mt small { font-size: 12px; color: var(--ink-2); }
.mitoggle { width: 100%; text-align: left; margin-top: 8px; }
.mitiles:hover .mt { border-color: var(--accent); }

/* kingdom sheet */
.kview { display: flex; flex-direction: column; gap: 14px; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.kin { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 16px; width: 100%; min-width: 0; text-transform: none; letter-spacing: 0; color: var(--ink); }
textarea.kin { min-height: 90px; resize: vertical; font-family: var(--body); }
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.attr h2 { font-size: 22px; }
.attr .tot { display: flex; align-items: baseline; gap: 10px; width: 100%; background: none; border: 0; padding: 0; margin: 6px 0; text-align: left; color: inherit; }
.attr .tot b { font-family: var(--mono); font-size: 38px; font-weight: 500; line-height: 1; }
.attr .tot b.pos { color: var(--good); } .attr .tot b.neg { color: var(--bad); }
.attr .tot:hover small { text-decoration: underline; }
.attr .tot small { color: var(--ink-2); font-size: 13px; }
.pan { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.big2 { font-family: var(--mono); font-size: 30px; font-weight: 500; line-height: 1.1; }
.edicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.role { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--line); }
.role.vacant { background: color-mix(in srgb, var(--warn) 9%, transparent); }
.role .rchk { flex: none; }
.role input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.role .rn { flex: 1 1 130px; display: flex; flex-direction: column; }
.role .rn small { color: var(--ink-2); font-size: 12px; }
.role .kin.rname { flex: 2 1 150px; width: auto; }
.role .rmod { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); }
.role .rmod .kin { width: 64px; }
.role .rfeat { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); }
.role .reff { flex: 1 1 100%; font-family: var(--mono); font-size: 13px; }
.role .rv { flex: 1 1 100%; font-size: 12.5px; color: var(--ink-2); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.mgrid button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; text-align: left; display: flex; justify-content: space-between; align-items: baseline; color: inherit; }
.mgrid button:hover { border-color: var(--accent); }
.mgrid b { font-family: var(--mono); font-weight: 500; font-size: 20px; }
.trow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr) 80px 80px auto; gap: 6px; margin-bottom: 6px; align-items: center; }
@media (max-width: 640px) { .trow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.tab.king { border-color: var(--accent); }
.incres { font-family: var(--mono); font-size: 14px; margin-top: 8px; }

function ghRepo() {
  var h = location.hostname, m = h.match(/^([^.]+)\.github\.io$/);
  if (m) { var seg = location.pathname.split('/')[1]; return m[1] + '/' + (seg && seg.indexOf('.') < 0 ? seg : h); }
  return lsGet(KEY + '-gh-repo') || '';
}
function ghToken() { return lsGet(KEY + '-gh-token') || ''; }
function b64dec(b) { var bin = atob(String(b).replace(/\s/g, '')), by = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
function b64enc(t) { var by = new TextEncoder().encode(t), bin = ''; for (var i = 0; i < by.length; i++) bin += String.fromCharCode(by[i]); return btoa(bin); }
function ghFetch(method, body) {
  var repo = ghRepo(), t = ghToken(), hd = {'Accept':'application/vnd.github+json'};

  if (!n) h = '<p class="note">Nic nenalezeno.</p>';
  document.getElementById('plist').innerHTML = h;
}
function brkRender() {
  var m = UI.modal, city = curCity(), cc = calcCity(city), k = m.k, list = (m.scope === 'kingdom' ? calcKingdom().src[k] : cc.src[k]) || [], grp = {}, order = [];
  list.forEach(function (x) { var q = grp[x.label]; if (!q) { q = grp[x.label] = {label:x.label, v:0, n:0, where:[]}; order.push(q); } q.v += x.v; q.n++; if (x.where) q.where.push(x.where); });
  order.sort(function (a, b) { return b.v - a.v; });
  var total = order.reduce(function (t, q) { return t + q.v; }, 0), isBp = k === 'bp';
  function val(v) { return isBp || k === 'bv' ? (k === 'bv' ? fmt(v) + ' gp' : fmt(v)) : sg(v); }
  function cls(v) { if (isBp || k === 'bv' || !v) return ''; return (GOODNEG[k] ? v < 0 : v > 0) ? 'pos' : 'neg'; }
  var h = '<div class="shade" data-act="shade"><div class="dlg" role="dialog" aria-modal="true" aria-label="Rozpis" style="width:min(560px,100%)"><div class="dlg-h"><h2>' + NAMEK[k] + ': odkud se bere</h2><button class="x" data-act="close" aria-label="Zavřít">×</button></div><div class="dlg-b">';
  if (!order.length) h += '<p class="note">Zatím nic nepřispívá.</p>';
  order.forEach(function (q) {
    var w = q.where.length > 8 ? q.where.slice(0, 8).join(', ') + ' …' : q.where.join(', ');
    h += '<div class="brk"><span><b>' + esc(q.label) + '</b>' + (q.n > 1 ? ' × ' + q.n : '') + (w ? '<span class="w">' + esc(w) + '</span>' : '') + '</span><b class="v ' + cls(q.v) + '">' + val(q.v) + '</b></div>';
  });
  h += '<div class="brk tot"><span>Celkem</span><b class="v ' + cls(total) + '">' + val(total) + '</b></div>';
  if (k === 'bv') h += '<p class="note">Limit pro ' + cc.size + ' je ' + cc.cap + ' gp; započítává se ' + cc.bvEff + ' gp. Cena magického předmětu nesmí base value převýšit.</p>';
  if (k === 'u') h += '<p class="note">Záporné Unrest je dobré. Zeď a příkop se počítají jednou za město. Unrest nemůže klesnout pod 0.</p>';
  if (k === 'bp') h += '<p class="note">Slevy ½ zapni v detailu stavby (klik na budovu).</p>';
  h += '<div class="row"><button class="btn" data-act="close">Zavřít</button></div></div></div></div>';
  modalEl.innerHTML = h;
}
function inspRender() {
  var m = UI.modal, d = curD(), city = curCity(), cc = calcCity(city), g = occ(d);
  var b = g[m.r][m.c], ovs = d.overlays.filter(function (o) { return o.r === m.r && o.c === m.c; });
  if (!b && !ovs.length) { closeModal(); return; }
  var h = '<div class="shade" data-act="shade"><div class="dlg" role="dialog" aria-modal="true" aria-label="Detail stavby" style="width:min(560px,100%)">';
  var D = b ? DEF[b.type] : null;
  h += '<div class="dlg-h"><h2>' + (D ? esc(D.name) : 'Lot ' + lotName(m.r, m.c)) + '</h2><button class="x" data-act="close" aria-label="Zavřít">×</button></div><div class="dlg-b">';
  if (D) {
    h += '<div class="m" style="font-family:var(--mono);font-size:13px;color:var(--ink-2)">' + CATS[D.cat] + ' · lot ' + lotName(b.r, b.c) + ' · ' + b.w + '×' + b.h + '</div>';
    h += '<div class="chips bigchips">' + chips(D) + '</div>';
    if (modsText(D)) h += '<div class="note" style="margin:0">' + esc(modsText(D)) + '</div>';
    if (D.note) h += '<div class="note" style="margin:0">' + esc(D.note) + '</div>';
    if (MI[b.type]) h += '<div class="note" style="margin:0">Magic item sloty: ' + MI[b.type].map(function (x) { return x[1] + '× ' + x[0] + ' (' + (x[2] === 'any' ? 'libovolný typ' : x[2]) + ')'; }).join('; ') + '</div>';
    if (DISC[b.type]) h += '<div class="note" style="margin:0">Sleva ½ BP, pokud ve městě už stojí: ' + DISC[b.type].map(function (t) { return (cc.types[t] ? '✓ ' : '') + DEF[t].name; }).join(', ') + '</div>';
    h += '<div class="row"><b style="font-family:var(--mono);font-size:20px">' + fmt(bpOf(b)) + ' BP</b>' + (D.bp && D.kind !== 'waterway' ? '<button class="tg" data-act="disc" aria-pressed="' + !!b.disc + '">Sleva ½ (související budova)</button>' : '') + '</div>';
    var wm = cc.warnMap[b.uid];
    if (wm) h += '<ul class="warns">' + wm.map(function (t) { return '<li><span>' + esc(t) + '</span></li>'; }).join('') + '</ul>';
  }
  var avail = DEFS.filter(function (x) { return x.kind === 'overlay' && !ovs.some(function (o) { return o.type === x.id; }) && (!x.needsWaterway || (D && D.kind === 'waterway')); });
  if (ovs.length || avail.length) {
    h += '<div class="h3">Sdílí tento lot</div><div class="ovl">';
    ovs.forEach(function (o) { var X = DEF[o.type], wo = cc.warnMap[o.uid]; h += '<div class="o"><span><b>' + esc(X.name) + '</b> <span class="chips" style="display:inline-flex">' + chips(X) + '</span>' + (wo ? '<br><span class="why" style="color:var(--warn);font-size:13px">' + esc(wo.join(' ')) + '</span>' : '') + '</span><button class="btn danger" data-act="rmov" data-uid="' + o.uid + '">Odebrat</button></div>'; });
    avail.forEach(function (X) { h += '<div class="o"><span><b>' + esc(X.name) + '</b> <span class="m" style="font-family:var(--mono);font-size:12px;color:var(--ink-2)">' + X.bp + ' BP</span> <span class="chips" style="display:inline-flex">' + chips(X) + '</span></span><button class="btn" data-act="addov" data-id="' + X.id + '">Přidat</button></div>'; });
    h += '</div>';
  }
  h += '<div class="row">' + (b ? '<button class="btn danger" data-act="demolish">Zbourat</button>' : '') + '<button class="btn" data-act="close">Zavřít</button></div></div></div></div>';
  modalEl.innerHTML = h;
}

/* ---------- actions ---------- */
var toastT;
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 5000); }
function refresh() { save(); render(); if (UI.modal && UI.modal.type === 'insp') inspRender(); }
function act(a, t) {
  var city = curCity(), d = curD(), ds = t.dataset;
  if (a !== 'delcity' && a !== 'deldist') UI.confirm = null;
  switch (a) {
    case 'city': S.cur = ds.id; UI.king = false; UI.econ = false; refresh(); break;
    case 'addcity': var c = newCity('Město ' + (S.cities.length + 1)); S.cities.push(c); S.cur = c.id; UI.econ = false; refresh(); toast('Nové město přidáno (příprava ' + TERR[c.terrain][1] + ' BP)'); break;
    case 'delcity':
      if (UI.confirm !== 'city') { UI.confirm = 'city'; render(); return; }
      UI.confirm = null; S.cities = S.cities.filter(function (x) { return x.id !== city.id; }); S.cur = S.cities[0].id; refresh(); break;
    case 'dist': city.cd = +ds.i; refresh(); break;
    case 'adddist': city.districts.push(newDistrict()); city.cd = city.districts.length - 1; refresh(); toast('District ' + city.districts.length + ' přidán (' + TERR[city.terrain][1] + ' BP)'); break;
    case 'deldist':
      if (UI.confirm !== 'dist') { UI.confirm = 'dist'; render(); return; }
      UI.confirm = null; city.districts.splice(city.cd, 1); city.cd = Math.max(0, city.cd - 1); refresh(); break;
    case 'bord':
      d.borders[ds.side] = ds.v;
      if (ds.v === 'water') { d.wall[ds.side] = 0; d.moat[ds.side] = 0; d.gate[ds.side] = 0; }
      refresh(); break;
    case 'fort': d[ds.k][ds.side] = d[ds.k][ds.side] ? 0 : 1; if (ds.k === 'wall' && !d.wall[ds.side]) d.gate[ds.side] = 0; refresh(); break;
    case 'infra': d[ds.k] = d[ds.k] ? 0 : 1; refresh(); break;
    case 'pick': UI.modal = {type:'pick', r:+ds.r, c:+ds.c, q:'', cat:'all', orient:'auto'}; renderModal(); var q = document.getElementById('q'); if (q && window.matchMedia('(pointer:fine)').matches) q.focus(); break;
    case 'insp': UI.modal = {type:'insp', r:+ds.r, c:+ds.c}; renderModal(); break;
    case 'close': closeModal(); break;
    case 'brk': UI.modal = {type:'brk', k:ds.k}; renderModal(); break;
    case 'kbrk': UI.modal = {type:'brk', k:ds.k, scope:'kingdom'}; renderModal(); break;
    case 'kingdom': UI.king = true; UI.econ = false; closeModal(); render(); break;
    case 'economy': UI.econ = true; UI.king = false; refresh(); break;
    case 'rolestoggle': UI.rolesOpen = !UI.rolesOpen; render(); break;
    case 'save': if (DBN) saveShared(); else ghSave(); break;
    case 'ghtoken': if (ghSetToken()) { toast('Token uložen v tomto prohlížeči.'); render(); } break;
    case 'restore': if (SH.prev) { try { S = norm(JSON.parse(SH.prev.json)); UI.king = false; save(); render(); toast('Načteno předchozí uložení. Pro sdílení klikni na Uložit.'); } catch (e) { toast('Předchozí uložení nejde načíst.'); } } break;
    case 'loadnew': if (SH.cur) { try { S = norm(JSON.parse(SH.cur.json)); SH.newer = false; lsSet(KEY + '-base', SH.cur.savedAt); if (SH.cur.sha) { lsSet(KEY + '-gh-sha', SH.cur.sha); lsSet(KEY + '-gh-base', SH.cur.json); } save(); render(); } catch (e) {} } break;
    case 'dlstate': download('state.json', JSON.stringify(S)); toast('Staženo state.json'); break;
    case 'rattr':
      var K = S.kingdom, rn = rulerCount(K), ix = K.ruler.indexOf(ds.k);
      if (ix >= 0) { if (K.ruler.length > 1) K.ruler.splice(ix, 1); } else K.ruler.push(ds.k);
      while (K.ruler.length > rn) K.ruler.shift();
      refresh(); break;
    case 'tradeadd': S.kingdom.trade.push({dest:'', status:'', bp:0, total:0}); refresh(); break;
    case 'tradedel': S.kingdom.trade.splice(+ds.i, 1); refresh(); break;
    case 'income':
      var XK = calcKingdom(), rr = 1 + Math.floor(Math.random() * 20), tt = rr + XK.total.e - XK.unrest;
      UI.income = {r:rr, e:XK.total.e, u:XK.unrest, tot:tt, treasurer:XK.treasurerOn, bp:XK.treasurerOn ? Math.max(0, Math.floor(tt / 5)) : 0};
      render(); break;
    case 'incomeadd': if (UI.income) { var ibp = UI.income.bp; S.kingdom.incomeBP = (+S.kingdom.incomeBP || 0) + ibp; UI.income = null; refresh(); toast('Daně připsány: +' + ibp + ' BP k BP celkem.'); } break;
    case 'migen': doGenItems(ds.scope === 'kingdom' ? null : city); break;
    case 'misell':
      var sc2 = S.cities.filter(function (x) { return x.id === ds.city; })[0] || city;
      var st2 = sc2.mi && sc2.mi[ds.key], nm2 = st2 ? st2.name : '', bp2 = TIERBP[ds.tier] || 0;
      S.kingdom.soldBP = (+S.kingdom.soldBP || 0) + bp2;
      (S.kingdom.sold = S.kingdom.sold || []).push({n:nm2, tier:ds.tier, bp:bp2});
      delete sc2.mi[ds.key];
      refresh();
      toast('Prodat: ' + nm2 + ' → +' + bp2 + ' BP (slot uvolněn).');
      break;
    case 'mibuy':
      var sc3 = S.cities.filter(function (x) { return x.id === ds.city; })[0] || city;
      var nm3 = sc3.mi && sc3.mi[ds.key] ? sc3.mi[ds.key].name : '';
      S.kingdom.bought = (+S.kingdom.bought || 0) + 1;
      delete sc3.mi[ds.key];
      refresh();
      toast('Koupit: ' + nm3 + ' → nic nestojí, slot uvolněn.');
      break;
    case 'gpadd': S.kingdom.gp.push({src:'', where:'', gp:0, cur:'gp'}); refresh(); break;
    case 'gpdel': S.kingdom.gp.splice(+ds.i, 1); refresh(); break;
    case 'mupkeep':
      var sl = slotsOf(city), res = [];
      city.districts.forEach(function (dd, di) {
        var open = sl.filter(function (x) { return x.di === di && !getSlot(city, x.key).name.trim(); });
        if (!open.length) return;
        var pick = open[Math.floor(Math.random() * open.length)], st = rollSlot(city, pick);
        res.push('D' + (di + 1) + ' ' + DEF[pick.b.type].name + ': ' + (st.roll > 50 ? st.kind + ' (d% ' + st.roll + ')' : 'nic (d% ' + st.roll + ')'));
      });
      refresh(); toast(res.length ? res.join(' · ') : 'Žádný prázdný slot');
      break;
    case 'shade': if (t === window.__shadeTarget) closeModal(); break;
    case 'pcat': UI.modal.cat = ds.k; pickInner(); break;
    case 'orient': UI.modal.orient = ds.v; pickInner(); break;
    case 'place':
      var D = DEF[ds.id], m = UI.modal;
      var cdisc = calcCity(city), autosave = !!(DISC[ds.id] && DISC[ds.id].some(function (t) { return cdisc.types[t]; }));
      if (D.kind === 'overlay') { d.overlays.push({uid:uid(), type:D.id, r:m.r, c:m.c}); }
      else {
        var fp = findFit(d, D, m.r, m.c, m.orient);
        if (!fp) { toast('Sem se nevejde'); return; }
        d.buildings.push({uid:uid(), type:D.id, r:fp.r, c:fp.c, w:fp.w, h:fp.h, disc:autosave});
        if (autosave) toast(D.name + ': sleva ½ BP (' + fmt(D.bp * 0.5) + ' BP), ve městě už stojí související budova.');
      }
      closeModal(); refresh(); break;
    case 'disc': var g = occ(d), bb = g[UI.modal.r][UI.modal.c]; if (bb) bb.disc = !bb.disc; refresh(); break;
    case 'demolish':
      var g2 = occ(d), b2 = g2[UI.modal.r][UI.modal.c];
      if (b2) { Object.keys(city.mi || {}).forEach(function (kk) { if (kk.indexOf(b2.uid + '_') === 0) delete city.mi[kk]; }); d.buildings = d.buildings.filter(function (x) { return x !== b2; }); d.overlays = d.overlays.filter(function (o) { return !(o.r >= b2.r && o.r < b2.r + b2.h && o.c >= b2.c && o.c < b2.c + b2.w); }); }
      closeModal(); refresh(); break;
    case 'addov': d.overlays.push({uid:uid(), type:ds.id, r:UI.modal.r, c:UI.modal.c}); refresh(); break;
    case 'rmov': d.overlays = d.overlays.filter(function (o) { return o.uid !== ds.uid; }); refresh(); break;
  }
}
document.addEventListener('mousedown', function (e) { window.__shadeTarget = e.target; });
document.addEventListener('touchstart', function (e) { window.__shadeTarget = e.target; }, {passive:true});
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT' || t.tagName === 'SELECT') return;
  if (t.disabled) return;
  act(t.dataset.act, t);
});
document.addEventListener('change', function (e) {
  var t = e.target, city = curCity();
  if (t.id === 'ldfile' && t.files && t.files[0]) {
    var rd = new FileReader();
    rd.onload = function () { try { var j = JSON.parse(rd.result); if (!j.cities || !j.cities.length) throw 0; delete j._savedAt; S = norm(j); UI.king = false; save(); render(); toast('Soubor načten'); } catch (er) { toast('Soubor se nepodařilo načíst'); } };
    rd.readAsText(t.files[0]); return;
  }
  if (t.id === 'cname') { city.name = t.value.trim() || 'Bez názvu'; refresh(); }
  else if (t.id === 'cterr') { city.terrain = t.value; refresh(); }
});
document.addEventListener('input', function (e) {
  var kfp = e.target.getAttribute ? e.target.getAttribute('data-kf') : null;
  if (kfp === 'bpcur') {
    var v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    var XK = calcKingdom();
    S.kingdom.treasury = v + XK.spent - (+S.kingdom.soldBP || 0) - (+S.kingdom.incomeBP || 0) - srcBP();
    save(); render(); return;
  }
  if (kfp) {
    var tt = e.target.getAttribute('data-t'), kv;
    if (tt === 'b') kv = e.target.checked;
    else if (tt === 'n') { kv = parseFloat(e.target.value); if (isNaN(kv)) { kset(kfp, 0); save(); return; } }
    else kv = e.target.value;
    kset(kfp, kv); save(); render(); return;
  }
  var mk = e.target.dataset && e.target.dataset.mi;
  if (mk) {
    var cty = curCity(), st = setSlot(cty, mk), f = e.target.dataset.f; st[f] = e.target.value; save();
    var cnt = document.getElementById('micounts'); if (cnt) cnt.innerHTML = miCounts(cty);
    if (f === 'url') { var an = document.querySelector('a[data-lnk="' + mk + '"]'); if (an) { var okU = safeUrl(e.target.value); an.hidden = !okU; if (okU) an.href = e.target.value.trim(); } }
    return;
  }
  if (e.target.id === 'q' && UI.modal && UI.modal.type === 'pick') { UI.modal.q = e.target.value; pickInner(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && UI.modal) closeModal(); });

S = load();
render();
initShared();
})();
